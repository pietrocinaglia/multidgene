<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MultiDGene Network Builder</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Tagify for gene input -->
  <link href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css" rel="stylesheet">
  
  <!-- Vis Network -->
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <style>
    #network {
      height: 500px;
      border: 1px solid #ccc;
      margin-top: 20px;
    }
  </style>
</head>
<body class="bg-light">

<div class="container mt-5">
  <h1 class="mb-4">MultiDGene Network Inference</h1>
  
  <form id="multidgeneForm">
    <div class="mb-3">
      <label for="geneInput" class="form-label">Enter Gene Symbols</label>
      <input id="geneInput" name="genes" placeholder="e.g. TP53, BRCA1" class="form-control" />
    </div>

    <div class="mb-3">
      <label for="tissueSelect" class="form-label">Select Tissues</label>
      <select multiple class="form-select" id="tissueSelect">
        <option>Brain</option>
        <option>Heart</option>
        <option>Lung</option>
        <option>Liver</option>
        <option>Skin</option>
        <option>Muscle</option>
      </select>
    </div>

    <div class="mb-3 row">
      <div class="col">
        <label for="p_threshold" class="form-label">P-Value Threshold</label>
        <input type="number" step="1e-8" value="1e-8" class="form-control" id="p_threshold">
      </div>
      <div class="col">
        <label for="s_min" class="form-label">Min Correlation (s)</label>
        <input type="number" step="0.1" value="0.5" class="form-control" id="s_min">
      </div>
      <div class="col">
        <label for="s_max" class="form-label">Max Correlation (s)</label>
        <input type="number" step="0.1" value="0.9" class="form-control" id="s_max">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Interlayer Mode</label>
      <select id="modeSelect" class="form-select">
        <option value="equal_exp">Equal Expression</option>
        <option value="diff_exp">Differential Expression</option>
        <option value="diff_co_exp">Differential Co-Expression</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Go!</button>
    <div id="downloadLinks" class="mt-3 d-none">
      <a id="csvLink" class="btn btn-success me-2" download>Download CSV</a>
      <a id="pngLink" class="btn btn-primary" download>Download PNG</a>
    </div>
  </form>

  <h3>Interactive Network Visualization</h3>
<div id="graph" style="height: 600px; border: 1px solid #ccc;"></div>

  <div id="output" class="mt-5">
    <h3>Edge List</h3>
    <pre id="edgeList" class="bg-white p-3 border rounded" style="max-height: 300px; overflow-y: auto;"></pre>

    <h3>Network Graph</h3>
    <div id="network"></div>
  </div>
</div>

<!-- Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify"></script>
<script>
  // Tagify input
  const input = document.querySelector('#geneInput');
  const tagify = new Tagify(input);

  document.getElementById('multidgeneForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const genes = tagify.value.map(tag => tag.value);
    const tissues = Array.from(document.getElementById('tissueSelect').selectedOptions).map(opt => opt.value);
    const p_threshold = parseFloat(document.getElementById('p_threshold').value);
    const s_min = parseFloat(document.getElementById('s_min').value);
    const s_max = parseFloat(document.getElementById('s_max').value);
    const mode = document.getElementById('modeSelect').value;

    const payload = {
      genes, tissues, mode, p_threshold, s_threshold: [s_min, s_max]
    };

    // Call backend API
    fetch('/api/run', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(data => {
      // Show download buttons
      document.getElementById('csvLink').href = data.csv;
      document.getElementById('pngLink').href = data.png;
      document.getElementById('downloadLinks').classList.remove('d-none');
    });

    document.getElementById('edgeList').textContent = JSON.stringify(result.edges, null, 2);

    // Graph visualization
    const nodes = new Set();
    const edges = result.edges.map(edge => {
      nodes.add(edge.source);
      nodes.add(edge.target);
      return {
        from: edge.source,
        to: edge.target,
        label: edge.layer,
        width: 2,
        color: { color: "#00f" }
      };
    });

    const data = {
      nodes: Array.from(nodes).map(n => ({ id: n, label: n })),
      edges
    };

    const container = document.getElementById('network');
    const network = new vis.Network(container, data, {
      edges: { arrows: "to", smooth: false },
      physics: { stabilization: true }
    });
  });
  
</script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
  fetch("/api/network")
    .then(res => res.json())
    .then(data => {
      const width = 800, height = 600;

      const svg = d3.select("#graph")
        .append("svg")
        .attr("viewBox", [0, 0, width, height])
        .call(d3.zoom().on("zoom", ({transform}) => {
          g.attr("transform", transform);
        }));

      const g = svg.append("g");

      const nodes = Array.from(new Set(data.flatMap(d => [d.source, d.target])))
                         .map(id => ({ id, layer: id.split("(").pop().replace(")", "") }));

      const color = d3.scaleOrdinal(d3.schemeTableau10);
      const nodeMap = new Map(nodes.map(n => [n.id, n]));

      const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(data).id(d => d.id).distance(100))
        .force("charge", d3.forceManyBody().strength(-300))
        .force("center", d3.forceCenter(width / 2, height / 2));

      const link = g.append("g")
        .attr("stroke", "#999")
        .attr("stroke-opacity", 0.6)
        .selectAll("line")
        .data(data)
        .join("line")
        .attr("stroke-width", d => Math.sqrt(d.weight || 1));

      const node = g.append("g")
        .attr("stroke", "#fff")
        .attr("stroke-width", 1.5)
        .selectAll("circle")
        .data(nodes)
        .join("circle")
        .attr("r", 8)
        .attr("fill", d => color(d.layer))
        .call(drag(simulation));

      const label = g.append("g")
        .selectAll("text")
        .data(nodes)
        .join("text")
        .text(d => d.id)
        .attr("x", 10)
        .attr("y", "0.35em")
        .style("font-size", "10px");

      node.append("title").text(d => d.id);

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
        node
          .attr("cx", d => d.x).attr("cy", d => d.y);
        label
          .attr("x", d => d.x + 10)
          .attr("y", d => d.y);
      });

      function drag(sim) {
        return d3.drag()
          .on("start", event => {
            if (!event.active) sim.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
          })
          .on("drag", event => {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
          })
          .on("end", event => {
            if (!event.active) sim.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
          });
      }

      // Add legend
      const layers = [...new Set(nodes.map(n => n.layer))];
      const legend = d3.select("#graph").append("div").style("margin-top", "10px");
      layers.forEach(layer => {
        legend.append("span")
          .style("display", "inline-block")
          .style("margin-right", "10px")
          .html(`<span style="display:inline-block;width:12px;height:12px;background:${color(layer)};margin-right:4px;"></span>${layer}`);
      });
    });
</script>   
</body>
</html>
