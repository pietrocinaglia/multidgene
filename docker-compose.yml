version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multidgene-backend
    restart: always
    volumes:
      - ./outputs:/app/outputs

  frontend:
    image: nginx:alpine
    container_name: multidgene-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - backend
