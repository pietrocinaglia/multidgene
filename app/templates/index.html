<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>multi-DGeNe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="/static/css/style.css" rel="stylesheet">
</head>

<body class="bg-light text-dark">
    <nav class="navbar bg-primary" data-bs-theme="dark" style="margin: 0; padding: 20px;">
        <a class="navbar-brand" href="#">
            <i class="bi bi-cpu-fill"></i> Multi-Dimensional Gene Network (multi-DGeNe)<BR>
            <small><i>Designed by Pietro Cinaglia - Magna Graecia University of Catanzaro, Italy</i></small>
        </a>
    </nav>

    <div class="container mt-5 mb-5">
        <!--<h2 class="text-center mb-4">Multi-Dimensional Gene Network (multi-DGeNe)</h2>-->

        <form id="networkForm">
            <div class="mb-4">
            <label for="genes" class="form-label fw-bold">🧬 Genes of Interest</label>
            <div class="form-floating">
                <textarea class="form-control gene-textarea shadow-sm" id="genes" placeholder="TP53, EGFR, MYC" style="height: 180px;"></textarea>
                <label for="genes">Enter gene symbols (comma-separated or one per line)</label>
            </div>
            <small class="text-muted fst-italic">Example: <code>TP53, EGFR, MYC</code></small>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">🧪 Select Tissues</label>
                <div class="row gy-2">
                    {% for tissue in tissues %}
                    <div class="col-md-4">
                        <div class="form-check form-switch tissue-checkbox p-2 ps-3 bg-white shadow-sm rounded-3">
                            <input class="form-check-input" type="checkbox" value="{{ tissue.value }}" id="{{ tissue.value }}">
                            <label class="form-check-label" for="{{ tissue.value }}">{{ tissue.label }}</label>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div class="mb-3">
                <label for="mode" class="form-label">Mode:</label>
                <select class="form-select" id="mode">
                    <option value="equal_exp" selected>Equal Expression</option>
                    <option value="diff_exp">Differential Expression</option>
                    <option value="diff_co_exp">Differential Co-Expression</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="p_threshold" class="form-label">p-value Threshold (e.g., 0.05):</label>
                <input type="number" step="0.001" class="form-control" id="p_threshold" value="0.05">
            </div>

            <button type="submit" class="btn btn-primary w-100">Generate Network</button>

        </form>

        <div id="loading" class="text-center mt-4" style="display: none;">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Generating network, please wait...</p>
        </div>
    </div>

    <div id="networkResult" style="width: 100%;"></div>
</body>

<script type="text/javascript" src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script type="text/javascript" src="/static/js/functions.js"></script>

</html>
